<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="signGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA0" />
      <stop offset="50%" stop-color="#FFCF24" />
      <stop offset="100%" stop-color="#BF8D00" />
    </linearGradient>
    <filter id="neonHalo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wallShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Architectural Dark Texture Wall Background -->
  <rect x="20" y="20" width="460" height="280" rx="14" fill="#0C0E14" stroke="#232838" stroke-width="2"/>
  <line x1="20" y1="90" x2="480" y2="90" stroke="#181D2A" stroke-width="1"/>
  <line x1="20" y1="160" x2="480" y2="160" stroke="#181D2A" stroke-width="1"/>
  <line x1="20" y1="230" x2="480" y2="230" stroke="#181D2A" stroke-width="1"/>

  <!-- Acrylic Floating Sign Board with Standoffs -->
  <g transform="translate(60, 55)" filter="url(#wallShadow)">
    <rect x="0" y="0" width="380" height="190" rx="12" fill="#141822" stroke="url(#signGold)" stroke-width="2.5"/>

    <!-- 4 Stainless Steel Wall Standoff Screws -->
    <circle cx="18" cy="18" r="8" fill="#8892A6" stroke="#4B5366" stroke-width="2"/>
    <circle cx="18" cy="18" r="3" fill="#141822"/>

    <circle cx="362" cy="18" r="8" fill="#8892A6" stroke="#4B5366" stroke-width="2"/>
    <circle cx="362" cy="18" r="3" fill="#141822"/>

    <circle cx="18" cy="172" r="8" fill="#8892A6" stroke="#4B5366" stroke-width="2"/>
    <circle cx="18" cy="172" r="3" fill="#141822"/>

    <circle cx="362" cy="172" r="8" fill="#8892A6" stroke="#4B5366" stroke-width="2"/>
    <circle cx="362" cy="172" r="3" fill="#141822"/>

    <!-- 3D Laser-cut Halo Illuminated Brand Text -->
    <text x="190" y="80" fill="url(#signGold)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="2" filter="url(#neonHalo)">MERLIMORRIS</text>
    
    <text x="190" y="110" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="4">PRINT &amp; SIGNAGE STUDIO</text>
    
    <line x1="80" y1="126" x2="300" y2="126" stroke="url(#signGold)" stroke-width="1.5" opacity="0.6"/>

    <text x="190" y="148" fill="#B8ADAD" font-family="sans-serif" font-size="10.5" text-anchor="middle">3D Acrylic • Backlit LED • Corflute • ACP Boards</text>
    
    <!-- Location Indicator -->
    <text x="190" y="168" fill="url(#signGold)" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">UNNAPPILAVU, MULLAITIVU • 24/6 SERVICE</text>
  </g>
</svg>
