<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="packGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA0" />
      <stop offset="100%" stop-color="#FFCF24" />
    </linearGradient>
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C29D70" />
      <stop offset="100%" stop-color="#8E6C42" />
    </linearGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left: Luxury Rigid Gift / Product Box (Matte Obsidian + Gold Foil) -->
  <g transform="translate(60, 60)" filter="url(#packShadow)">
    <!-- Box Bottom Body -->
    <polygon points="40,90 190,90 220,190 70,190" fill="#11141C" stroke="#2B3242" stroke-width="2"/>
    
    <!-- Box Lid (Slightly tilted up) -->
    <polygon points="30,75 180,75 230,120 80,120" fill="#1C212E" stroke="url(#packGold)" stroke-width="2"/>

    <!-- Gold Foil Branding on Box Top -->
    <circle cx="130" cy="98" r="14" fill="none" stroke="url(#packGold)" stroke-width="1.5"/>
    <text x="130" y="103" fill="url(#packGold)" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">M</text>
    
    <text x="145" y="155" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" text-anchor="middle">CUSTOM RIGID BOX</text>
    <text x="145" y="172" fill="#B8ADAD" font-family="sans-serif" font-size="9" text-anchor="middle">Embossed &amp; Foil Stamped</text>
  </g>

  <!-- Right: Eco Kraft Shopping Paper Bag with Rope Handles -->
  <g transform="translate(280, 40)" filter="url(#packShadow)">
    <!-- Rope Handles -->
    <path d="M 50 60 C 50 15 95 15 95 60" fill="none" stroke="#5E4323" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60 60 C 60 20 105 20 105 60" fill="none" stroke="#7A5832" stroke-width="4" stroke-linecap="round"/>

    <!-- Paper Bag Body -->
    <polygon points="20,60 135,60 155,230 40,230" fill="url(#kraftGrad)" stroke="#594022" stroke-width="2"/>
    <polygon points="135,60 170,80 190,250 155,230" fill="#755631" stroke="#594022" stroke-width="2"/>

    <!-- Printed Logo on Bag -->
    <circle cx="95" cy="130" r="24" fill="#161A24" stroke="url(#packGold)" stroke-width="2"/>
    <text x="95" y="136" fill="url(#packGold)" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">M</text>
    
    <text x="95" y="175" fill="#1C140A" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="10" text-anchor="middle">MERLIMORRIS</text>
    <text x="95" y="190" fill="#3D2914" font-family="sans-serif" font-weight="700" font-size="8" text-anchor="middle">ECO PACKAGING</text>
  </g>
</svg>
