<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="banGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA0" />
      <stop offset="100%" stop-color="#FFCF24" />
    </linearGradient>
    <linearGradient id="standMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B8294" />
      <stop offset="50%" stop-color="#BAC0CF" />
      <stop offset="100%" stop-color="#586072" />
    </linearGradient>
    <filter id="bannerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left: Outdoor Grommeted Heavy-Duty Vinyl Banner -->
  <g transform="translate(30, 60)" filter="url(#bannerShadow)">
    <rect x="0" y="0" width="250" height="150" rx="8" fill="#151A24" stroke="url(#banGold)" stroke-width="2.5"/>
    
    <!-- Brass Grommets / Eyelets in all 4 corners -->
    <circle cx="15" cy="15" r="7" fill="#C59B27" stroke="#FFEAA0" stroke-width="2"/>
    <circle cx="15" cy="15" r="3" fill="#0E1118"/>

    <circle cx="235" cy="15" r="7" fill="#C59B27" stroke="#FFEAA0" stroke-width="2"/>
    <circle cx="235" cy="15" r="3" fill="#0E1118"/>

    <circle cx="15" cy="135" r="7" fill="#C59B27" stroke="#FFEAA0" stroke-width="2"/>
    <circle cx="15" cy="135" r="3" fill="#0E1118"/>

    <circle cx="235" cy="135" r="7" fill="#C59B27" stroke="#FFEAA0" stroke-width="2"/>
    <circle cx="235" cy="135" r="3" fill="#0E1118"/>

    <!-- Banner Graphic Content -->
    <text x="125" y="55" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="19" text-anchor="middle" letter-spacing="0.5">GRAND OPENING</text>
    <text x="125" y="78" fill="url(#banGold)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle">510GSM HEAVY VINYL</text>
    <text x="125" y="102" fill="#B8ADAD" font-family="sans-serif" font-size="10" text-anchor="middle">UV &amp; Rain Resistant • Reinforced Edges</text>
    
    <rect x="45" y="115" width="160" height="18" rx="4" fill="#FFCF24"/>
    <text x="125" y="128" fill="#000" font-family="sans-serif" font-weight="800" font-size="9" text-anchor="middle">MERLIMORRIS PRINTING SHOP</text>
  </g>

  <!-- Right: Roll-up Exhibition Standee -->
  <g transform="translate(325, 25)" filter="url(#bannerShadow)">
    <!-- Stand Base -->
    <rect x="15" y="260" width="110" height="16" rx="4" fill="url(#standMetal)"/>
    <rect x="35" y="272" width="70" height="6" rx="3" fill="#3D4559"/>

    <!-- Back Support Pole -->
    <line x1="70" y1="20" x2="70" y2="260" stroke="#8E97AB" stroke-width="3"/>

    <!-- Banner Graphic Display -->
    <rect x="25" y="20" width="90" height="240" rx="3" fill="#1C2230" stroke="#FFCF24" stroke-width="1.5"/>
    <rect x="32" y="28" width="76" height="50" rx="3" fill="#283247"/>
    <circle cx="70" cy="53" r="16" fill="#FFCF24" opacity="0.6"/>
    
    <text x="70" y="98" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="9" text-anchor="middle">BUSINESS</text>
    <text x="70" y="112" fill="#FFCF24" font-family="sans-serif" font-weight="800" font-size="9" text-anchor="middle">EXPO STAND</text>
    
    <line x1="35" y1="130" x2="105" y2="130" stroke="#FFCF24" stroke-width="1"/>
    
    <rect x="35" y="145" width="70" height="6" rx="2" fill="#B8ADAD"/>
    <rect x="35" y="158" width="60" height="6" rx="2" fill="#4C5770"/>
    <rect x="35" y="171" width="65" height="6" rx="2" fill="#4C5770"/>

    <circle cx="70" cy="210" r="14" fill="#FFCF24"/>
    <text x="70" y="214" fill="#000" font-family="sans-serif" font-weight="900" font-size="9" text-anchor="middle">24/6</text>
    <text x="70" y="245" fill="#B8ADAD" font-family="sans-serif" font-size="7" text-anchor="middle">Mullaitivu</text>
  </g>
</svg>
