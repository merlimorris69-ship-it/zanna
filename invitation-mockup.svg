<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="invGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA0" />
      <stop offset="50%" stop-color="#FFCF24" />
      <stop offset="100%" stop-color="#C29000" />
    </linearGradient>
    <filter id="invShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Envelope in Background with Open Flap -->
  <g transform="translate(60, 40)" filter="url(#invShadow)">
    <polygon points="0,70 170,0 340,70 340,230 0,230" fill="#1A1E29" stroke="#3A4254" stroke-width="2"/>
    <polygon points="0,70 170,150 340,70" fill="#13161F" stroke="#2D3442" stroke-width="1.5"/>
  </g>

  <!-- Wedding Invitation Card (Textured Cardstock with Gold Foil Monogram) -->
  <g transform="matrix(0.98 -0.02 0.02 0.98 100 50)" filter="url(#invShadow)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="#181B26" stroke="url(#invGold)" stroke-width="2.5"/>
    
    <!-- Ornate Gold Foil Floral Border Frame -->
    <rect x="14" y="14" width="252" height="172" rx="6" fill="none" stroke="url(#invGold)" stroke-width="1" stroke-dasharray="8 4"/>

    <!-- Couple Monogram -->
    <circle cx="140" cy="55" r="22" fill="none" stroke="url(#invGold)" stroke-width="1.5"/>
    <text x="140" y="62" fill="url(#invGold)" font-family="'Plus Jakarta Sans', serif" font-weight="700" font-size="16" text-anchor="middle">S &amp; M</text>

    <text x="140" y="94" fill="#B8ADAD" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" text-anchor="middle" letter-spacing="2">TOGETHER WITH THEIR FAMILIES</text>
    
    <text x="140" y="118" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" text-anchor="middle">INVITE YOU TO CELEBRATE</text>
    
    <text x="140" y="136" fill="url(#invGold)" font-family="serif" font-style="italic" font-size="13" text-anchor="middle">Their Wedding Day</text>

    <line x1="80" y1="148" x2="200" y2="148" stroke="url(#invGold)" stroke-width="1"/>

    <text x="140" y="165" fill="#E2DFDF" font-family="sans-serif" font-size="9.5" text-anchor="middle">Luxury Foil Stamping • Pearl Linen • Custom Envelopes</text>
  </g>

  <!-- Wax Seal Stamp in Gold/Bronze -->
  <g transform="translate(370, 190)" filter="url(#invShadow)">
    <circle cx="20" cy="20" r="20" fill="url(#invGold)" stroke="#FFEAA0" stroke-width="2"/>
    <circle cx="20" cy="20" r="16" fill="none" stroke="#684A00" stroke-width="1"/>
    <text x="20" y="26" fill="#4B3500" font-family="serif" font-weight="900" font-size="15" text-anchor="middle">M</text>
  </g>
</svg>
