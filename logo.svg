<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA0" />
      <stop offset="50%" stop-color="#FFCF24" />
      <stop offset="100%" stop-color="#C69500" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2330" />
      <stop offset="100%" stop-color="#0E1118" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FFCF24" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="15" y="15" width="170" height="170" rx="36" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldGlow)"/>

  <!-- Precision CMYK Registration Marks / Dots -->
  <circle cx="100" cy="42" r="5" fill="#00E5FF" />
  <circle cx="100" cy="158" r="5" fill="#FF007F" />
  <circle cx="42" cy="100" r="5" fill="#FFCF24" />
  <circle cx="158" cy="100" r="5" fill="#B8ADAD" />

  <!-- Printing Press Roller & Paper Sheet -->
  <rect x="52" y="62" width="96" height="76" rx="10" fill="#232838" stroke="#B8ADAD" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Stylized M Monogram in Pure Gold -->
  <path d="M 66 126 L 66 74 L 84 105 L 100 84 L 116 105 L 134 74 L 134 126" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Printing Speed Lines -->
  <path d="M 52 142 L 148 142" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
</svg>
