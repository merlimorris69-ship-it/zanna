<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="flyerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA0" />
      <stop offset="100%" stop-color="#FFCF24" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222838" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>
    <filter id="flyerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Left Tri-fold Brochure Flap -->
  <g transform="matrix(0.96 0.08 -0.05 0.98 60 40)" filter="url(#flyerShadow)">
    <rect x="0" y="0" width="160" height="230" rx="8" fill="#181D29" stroke="#3D4559" stroke-width="1.5"/>
    <rect x="15" y="20" width="130" height="80" rx="6" fill="#283042"/>
    <circle cx="80" cy="60" r="22" fill="#00E5FF" opacity="0.4"/>
    <rect x="20" y="120" width="120" height="12" rx="4" fill="url(#flyerGold)"/>
    <rect x="20" y="145" width="100" height="7" rx="3.5" fill="#B8ADAD"/>
    <rect x="20" y="160" width="115" height="7" rx="3.5" fill="#4B556D"/>
    <rect x="20" y="175" width="85" height="7" rx="3.5" fill="#4B556D"/>
    <rect x="20" y="195" width="60" height="18" rx="4" fill="#FFCF24"/>
  </g>

  <!-- Right Primary A5 Flyer (High-Gloss Art Paper) -->
  <g transform="matrix(0.98 -0.04 0.04 0.99 210 30)" filter="url(#flyerShadow)">
    <rect x="0" y="0" width="200" height="260" rx="10" fill="url(#pageGrad)" stroke="url(#flyerGold)" stroke-width="2"/>
    
    <!-- Header Banner Image Box -->
    <rect x="12" y="12" width="176" height="105" rx="6" fill="#1C2333"/>
    <circle cx="100" cy="55" r="30" fill="#FF007F" opacity="0.3"/>
    <circle cx="125" cy="70" r="24" fill="#FFCF24" opacity="0.4"/>
    <text x="100" y="65" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" text-anchor="middle">SALE &amp; PROMO</text>

    <!-- Headline and content -->
    <text x="16" y="142" fill="url(#flyerGold)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">SPECIAL OFFERS</text>
    <text x="16" y="160" fill="#B8ADAD" font-family="sans-serif" font-weight="600" font-size="10">High Gloss 170gsm Full Color</text>
    
    <!-- Bullets -->
    <circle cx="22" cy="182" r="3" fill="#FFCF24"/>
    <text x="32" y="185" fill="#E2DFDF" font-family="sans-serif" font-size="9.5">Local Business Promotion</text>
    <circle cx="22" cy="198" r="3" fill="#FFCF24"/>
    <text x="32" y="201" fill="#E2DFDF" font-family="sans-serif" font-size="9.5">Event Handouts &amp; Menus</text>
    <circle cx="22" cy="214" r="3" fill="#FFCF24"/>
    <text x="32" y="217" fill="#E2DFDF" font-family="sans-serif" font-size="9.5">Fast 24-Hour Turnaround</text>

    <!-- Bottom CTA Bar -->
    <rect x="14" y="230" width="172" height="18" rx="4" fill="#FFCF24"/>
    <text x="100" y="243" fill="#111" font-family="sans-serif" font-weight="800" font-size="9.5" text-anchor="middle">CALL +94 71 988 7110</text>
  </g>
</svg>
