<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1D2230" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas background -->
  <rect width="600" height="360" fill="#0C0E14" />
  <rect width="600" height="360" fill="url(#grid)" />

  <!-- Outer Bleed Area (Red Dashed) - 3mm (0.125") -->
  <rect x="70" y="40" width="460" height="260" rx="8" fill="#141926" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- Trim / Cut Line (Gold Solid) - Actual Finished Product Size -->
  <rect x="95" y="65" width="410" height="210" rx="4" fill="#1A2030" stroke="#FFCF24" stroke-width="3"/>

  <!-- Safe Zone Margin (Green Dotted) - Keep Text/Important elements inside -->
  <rect x="120" y="90" width="360" height="160" rx="2" fill="#20273A" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Content Representation Inside Safe Zone -->
  <rect x="145" y="115" width="45" height="45" rx="8" fill="#FFCF24" opacity="0.2" stroke="#FFCF24" stroke-width="1.5"/>
  <text x="167" y="142" fill="#FFCF24" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">LOGO</text>
  
  <rect x="210" y="125" width="230" height="12" rx="4" fill="#FFFFFF"/>
  <rect x="210" y="145" width="180" height="8" rx="4" fill="#B8ADAD"/>
  <rect x="210" y="160" width="140" height="8" rx="4" fill="#B8ADAD"/>

  <text x="300" y="210" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" text-anchor="middle">SAFE ZONE: KEEP ALL TEXT &amp; ESSENTIAL ART HERE</text>

  <!-- Dimension Indicator & Labels -->
  <!-- Top: Bleed -->
  <line x1="70" y1="28" x2="95" y2="28" stroke="#EF4444" stroke-width="2"/>
  <text x="82" y="22" fill="#EF4444" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">3mm Bleed</text>

  <!-- Left Dimension Indicators -->
  <text x="80" y="325" fill="#EF4444" font-family="sans-serif" font-weight="700" font-size="11">■ Bleed Line (+3mm extension)</text>
  <text x="245" y="325" fill="#FFCF24" font-family="sans-serif" font-weight="700" font-size="11">■ Trim Cut Line (Exact Size)</text>
  <text x="420" y="325" fill="#10B981" font-family="sans-serif" font-weight="700" font-size="11">■ Safe Zone Margin (5mm inside)</text>
</svg>
